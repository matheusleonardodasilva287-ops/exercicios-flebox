<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página com miolo</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; }

  .pagina { display: flex; flex-direction: column; min-height: 100vh; }
  .miolo  { display: flex; flex: 1; }
  aside   { flex: 0 0 10rem; background: #e0e7ff; padding: 1rem; }
  main    { flex: 1; min-width: 0; padding: 1rem; overflow-wrap: anywhere; }
  header, footer { background: #1e293b; color: #fff; padding: 1rem; }
</style>
</head>
<body>
  <div class="pagina">
    <header>topo</header>
    <div class="miolo">
      <aside>menu</aside>
      <main>
        texto. Teste com uma palavra enorme:
        Pneumoultramicroscopicossilicovulcanoconiótico_Pneumoultramicroscopicossilicovulcanoconiótico
      </main>
    </div>
    <footer>rodapé</footer>
  </div>
</body>
</html>
